spark.master             yarn
spark.submit.deployMode  cluster
# Without this, Spark re-uploads its whole jars/ dir to HDFS on every
# submission (the "Neither spark.yarn.jars nor spark.yarn.archive is set"
# warning) — slow, and it's the same jars every time. Uploaded once by
# hadoop-master's entrypoint, same pattern as Tez's tez.lib.uris.
spark.yarn.jars          hdfs://hadoop-master:9000/apps/spark/jars/*.jar
# The native Hadoop libs (libhadoop.so etc.) are genuinely present and
# compatible with this platform (checked with ldd) — Spark's JVMs just
# weren't told where to find them, hence the "Unable to load
# native-hadoop library" warning falling back to slower Java codecs.
spark.driver.extraLibraryPath    /opt/hadoop/lib/native
spark.executor.extraLibraryPath  /opt/hadoop/lib/native
# Silences the GC-metrics warning (only matters with event logging on,
# which we don't use) — the exact MXBean names JDK reports for G1GC.
spark.eventLog.gcMetrics.youngGenerationGarbageCollectors  G1 Young Generation
spark.eventLog.gcMetrics.oldGenerationGarbageCollectors    G1 Old Generation,G1 Concurrent GC
