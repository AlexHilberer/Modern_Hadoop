# A SparkSession created directly inside a running notebook kernel is
# inherently client-mode (the driver is the current process), so there's
# no deployMode override here, unlike the shared hadoop-base image's
# version (which sets cluster mode for Airflow's batch spark-submit calls).
spark.master   yarn
# See docker/hadoop-base/conf/spark-defaults.conf for why.
spark.yarn.jars  hdfs://hadoop-master:9000/apps/spark/jars/*.jar
spark.driver.extraLibraryPath    /opt/hadoop/lib/native
spark.executor.extraLibraryPath  /opt/hadoop/lib/native
spark.eventLog.gcMetrics.youngGenerationGarbageCollectors  G1 Young Generation
spark.eventLog.gcMetrics.oldGenerationGarbageCollectors    G1 Old Generation,G1 Concurrent GC
