services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - hadoop-net

  hadoop-master:
    build:
      context: ./docker/hadoop-base
    image: modern-hadoop-base:latest
    container_name: hadoop-master
    hostname: hadoop-master
    environment:
      - NODE_ROLE=master
    depends_on:
      - postgres
    ports:
      - "9870:9870"
      - "8088:8088"
    volumes:
      - hadoop-master-data:/opt/hadoop-data
      - ./jobs:/jobs:ro
    networks:
      - hadoop-net

  hive-metastore:
    build:
      context: ./docker/hadoop-base
    image: modern-hadoop-base:latest
    container_name: hive-metastore
    hostname: hive-metastore
    environment:
      - NODE_ROLE=hive-metastore
    depends_on:
      - hadoop-master
      - postgres
    ports:
      - "9083:9083"
    volumes:
      - hive-metastore-data:/opt/hadoop-data
    networks:
      - hadoop-net

  hiveserver2:
    build:
      context: ./docker/hadoop-base
    image: modern-hadoop-base:latest
    container_name: hiveserver2
    hostname: hiveserver2
    environment:
      - NODE_ROLE=hiveserver2
    depends_on:
      - hive-metastore
    ports:
      - "10000:10000"
    networks:
      - hadoop-net

  hadoop-worker1:
    build:
      context: ./docker/hadoop-base
    image: modern-hadoop-base:latest
    container_name: hadoop-worker1
    hostname: hadoop-worker1
    environment:
      - NODE_ROLE=worker
    depends_on:
      - hadoop-master
      - zookeeper
    volumes:
      - hadoop-worker1-data:/opt/hadoop-data
    networks:
      - hadoop-net

  hadoop-worker2:
    build:
      context: ./docker/hadoop-base
    image: modern-hadoop-base:latest
    container_name: hadoop-worker2
    hostname: hadoop-worker2
    environment:
      - NODE_ROLE=worker
    depends_on:
      - hadoop-master
      - zookeeper
    volumes:
      - hadoop-worker2-data:/opt/hadoop-data
    networks:
      - hadoop-net

  zookeeper:
    build:
      context: ./docker/hadoop-base
    image: modern-hadoop-base:latest
    container_name: zookeeper
    hostname: zookeeper
    environment:
      - NODE_ROLE=zookeeper
    volumes:
      - zookeeper-data:/opt/hadoop-data
    networks:
      - hadoop-net

  hbase-master:
    build:
      context: ./docker/hadoop-base
    image: modern-hadoop-base:latest
    container_name: hbase-master
    hostname: hbase-master
    environment:
      - NODE_ROLE=hbase-master
    depends_on:
      - hadoop-master
      - zookeeper
    ports:
      - "16010:16010"
      - "9090:9090"
    volumes:
      - hbase-master-data:/opt/hadoop-data
    networks:
      - hadoop-net

  stream-producer:
    build:
      context: ./docker/stream-producer
    container_name: stream-producer
    hostname: stream-producer
    restart: unless-stopped
    networks:
      - hadoop-net

  airflow:
    build:
      context: ./docker/airflow
    container_name: airflow
    hostname: airflow
    depends_on:
      - postgres
      - hadoop-master
      - hiveserver2
    ports:
      - "8080:8080"
    volumes:
      - airflow-data:/opt/airflow-data
      - ./jobs:/jobs:ro
      - ./docker/airflow/dags:/opt/airflow/dags:ro
    networks:
      - hadoop-net

  jupyterlab:
    build:
      context: ./docker/jupyter
    container_name: jupyterlab
    hostname: jupyterlab
    depends_on:
      - hadoop-master
      - hbase-master
      - hiveserver2
    ports:
      - "8888:8888"
    volumes:
      - ./jobs:/jobs:ro
      - ./notebooks:/opt/notebooks
    networks:
      - hadoop-net

  streamlit:
    build:
      context: ./docker/streamlit
    container_name: streamlit
    hostname: streamlit
    depends_on:
      - airflow
      - hadoop-master
      - stream-producer
    ports:
      - "8501:8501"
    volumes:
      - airflow-data:/opt/airflow-data:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - hadoop-net

networks:
  hadoop-net:
    driver: bridge

volumes:
  hadoop-master-data:
  hadoop-worker1-data:
  hadoop-worker2-data:
  postgres-data:
  zookeeper-data:
  hbase-master-data:
  airflow-data:
  hive-metastore-data:
